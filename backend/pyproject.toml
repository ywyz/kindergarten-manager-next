[project]
name = "kindergarten-manager-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13,<2",
    "pymysql[rsa]>=1.1,<2",
    "pydantic-settings>=2.6,<3",
    # I5 slice 2: OOXML point edits via ZIP + lxml (user-confirmed 2026-09-28).
    "lxml>=6.1,<7",
    # Pinned per I2 spec; declared only, not installed/synced in this phase.
    "chinesecalendar==1.11.0",
    # AI 1A: AES-256-GCM secret encryption (already locked at 50.0.1 via
    # pymysql[rsa]; now declared direct per checklist §1 #9).
    "cryptography==50.0.1",
]

[tool.uv]
package = false
