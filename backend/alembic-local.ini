[alembic]
# Supported CLI runs (``python -m alembic -c alembic-local.ini upgrade head``)
# are executed from this directory, so both values are relative and contain
# no ``%(here)s`` token: ConfigParser re-interpolates a substituted value
# that itself contains ``%`` (R3, 2026-10-13), which aborts startup when the
# checkout/install directory contains a legal ``%``. The programmatic entry
# (``app.local.migrate.alembic_config``) replaces both with absolute,
# ``%``-escaped paths so the app runs from any working directory.
script_location = migrations_local
prepend_sys_path = .
path_separator = os
# The SQLite file is resolved by migrations_local/env.py: programmatic runs
# pass sqlalchemy.url through config attributes/options; CLI runs resolve the
# data directory from KGM_LOCAL_DB_PATH / KGM_LOCAL_DATA_DIR / the fixed
# LOCALAPPDATA location. No legacy DATABASE_URL/.env is ever read.
