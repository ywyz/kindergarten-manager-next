name: Windows 11 weekly validation build

# Builds and statically verifies the complete weekly-plan Windows package.
# This is a windows-2022 x64 build, not a Windows 11 runtime/target test.
# A manual run from the exact one-to-one-listening branch additionally
# compiles the unsigned per-user test installer and skips the portable
# handoff upload; other branches keep the existing handoff behavior.
"on":
  push:
    branches:
      - codex/desktop-v2-foundation
    paths:
      - "backend/**"
      - "desktop/**"
      - "frontend/**"
      - "docs/bootstrap/desktop-weekly-windows11-manual.md"
      - ".github/workflows/windows11-weekly-validation.yml"
      - ".github/scripts/build-windows11-validation.ps1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows11-weekly-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and statically verify Windows x64 package
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      APP_DISABLE_DOTENV: "1"
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout trusted branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up exact CPython
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.10"
          architecture: "x64"
          check-latest: false

      - name: Set up exact Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.0"
          check-latest: false

      - name: Record toolchain versions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pythonVersion = (& python --version 2>&1 | Out-String).Trim()
          $nodeVersion = (& node --version 2>&1 | Out-String).Trim()
          $npmVersion = (& npm --version 2>&1 | Out-String).Trim()
          if ($pythonVersion -ne 'Python 3.14.10') {
            throw "Expected Python 3.14.10, got: $pythonVersion"
          }
          & python -c "import struct, sys, sysconfig; assert sys.implementation.name == 'cpython'; assert sys.version_info[:3] == (3, 14, 10); assert struct.calcsize('P') * 8 == 64; assert sysconfig.get_platform().lower() == 'win-amd64'; assert getattr(sys, '_is_gil_enabled', lambda: True)()"
          if ($LASTEXITCODE -ne 0) {
            throw "Python is not the required CPython 3.14.10 x64 standard-GIL build"
          }
          if ($nodeVersion -ne 'v26.13.0') {
            throw "Expected Node v26.13.0, got: $nodeVersion"
          }
          Write-Host "Python: $pythonVersion"
          Write-Host "Node: $nodeVersion"
          Write-Host "npm: $npmVersion"

      - name: Build, verify, and assemble handoff
        shell: pwsh
        env:
          EVIDENCE_ROOT: ${{ runner.temp }}/kgm-weekly-win11-ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $ErrorActionPreference = 'Stop'
          & "$env:GITHUB_WORKSPACE/.github/scripts/build-windows11-validation.ps1" `
            -RepoRoot $env:GITHUB_WORKSPACE `
            -EvidenceRoot $env:EVIDENCE_ROOT `
            -RunId "${{ github.run_id }}" `
            -RunAttempt "${{ github.run_attempt }}" `
            -Repository "${{ github.repository }}" `
            -CommitSha "${{ github.sha }}" `
            -ServerUrl "${{ github.server_url }}"
          if ($LASTEXITCODE -ne 0) {
            throw "build-windows11-validation.ps1 failed with exit code $LASTEXITCODE"
          }

      - name: Upload minimal handoff
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/desktop-one-to-one-listening') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows11-weekly-validation-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kgm-weekly-win11-ci-${{ github.run_id }}-${{ github.run_attempt }}/handoff
          if-no-files-found: error
          retention-days: 14

      - name: Build unsigned one-to-one-listening test installer
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/desktop-one-to-one-listening' }}
        shell: pwsh
        env:
          EVIDENCE_ROOT: ${{ runner.temp }}/kgm-weekly-win11-ci-${{ github.run_id }}-${{ github.run_attempt }}
          INSTALLER_ROOT: ${{ runner.temp }}/kgm-listening-installer-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $ErrorActionPreference = 'Stop'
          & "$env:GITHUB_WORKSPACE/.github/scripts/build-windows11-listening-installer.ps1" `
            -RepoRoot $env:GITHUB_WORKSPACE `
            -BuildRoot "$env:GITHUB_WORKSPACE/build/desktop-e14-weekly-ci-${{ github.run_id }}-${{ github.run_attempt }}" `
            -ValidationSummary "$env:EVIDENCE_ROOT/handoff/validation-summary.json" `
            -InstallerRoot $env:INSTALLER_ROOT `
            -RunId "${{ github.run_id }}" `
            -RunAttempt "${{ github.run_attempt }}" `
            -Repository "${{ github.repository }}" `
            -CommitSha "${{ github.sha }}"
          if ($LASTEXITCODE -ne 0) {
            throw "build-windows11-listening-installer.ps1 failed with exit code $LASTEXITCODE"
          }

      - name: Upload unsigned one-to-one-listening test installer
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/desktop-one-to-one-listening' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/kgm-listening-installer-${{ github.run_id }}-${{ github.run_attempt }}/KGNext-Listening-Win11-x64-Setup.exe
          archive: false
          if-no-files-found: error
          retention-days: 14
